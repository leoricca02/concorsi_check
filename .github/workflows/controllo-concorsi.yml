name: Controllo concorsi

on:
  schedule:
    # Quando controllare (orari in UTC: in Italia +1 d'inverno, +2 d'estate). Scegli UNA riga:
    - cron: "17 6 * * 1"        # ogni lunedì alle 6:17 UTC
    # - cron: "17 6 1,15 * *"   # due volte al mese (giorno 1 e 15)
    # - cron: "17 6 1 * *"      # una volta al mese
  workflow_dispatch:            # pulsante "Run workflow" nella scheda Actions, per un controllo immediato

permissions:
  contents: write   # per salvare data/stato.json e reports/ nel repository
  issues: write     # per aprire una issue quando ci sono novità

concurrency:
  group: controllo-concorsi
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla le fonti
        id: controllo
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m concorsi --issue-file "$RUNNER_TEMP/issue.md"

      - name: Salva stato e report
        if: always() && steps.controllo.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "Niente da salvare"
          else
            git commit -m "Controllo concorsi del $(date +%d/%m/%Y)"
            git push
          fi

      - name: Apri una issue con le novità
        if: fromJSON(steps.controllo.outputs.nuovi || '0') > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🆕 ${{ steps.controllo.outputs.nuovi }} nuovi concorsi rilevanti ($(date +%d/%m/%Y))" \
            --body-file "$RUNNER_TEMP/issue.md"

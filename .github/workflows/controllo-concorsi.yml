name: Controllo concorsi

on:
  schedule:
    # Quando controllare (orari in UTC: in Italia +1 d'inverno, +2 d'estate). Scegli UNA riga:
    - cron: "17 6 * * 2,5"      # martedì e venerdì alle 6:17 UTC, i giorni in cui esce la Gazzetta
    # - cron: "17 6 * * 1"      # una volta a settimana (lunedì)
    # - cron: "17 6 1 * *"      # una volta al mese
  workflow_dispatch:            # pulsante "Run workflow" nella scheda Actions, per un controllo immediato
  push:                         # e subito dopo ogni modifica alla configurazione o al codice
    paths:
      - "config.yaml"
      - "concorsi/**"
      - ".github/workflows/controllo-concorsi.yml"

permissions:
  contents: write   # per salvare data/stato.json e reports/ nel repository
  issues: write     # per aprire una issue quando ci sono novità

concurrency:
  group: controllo-concorsi
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla le fonti
        id: controllo
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILO_CANDIDATO: ${{ secrets.PROFILO_CANDIDATO }}
        run: python -m concorsi --issue-file "$RUNNER_TEMP/issue.md"

      - name: Salva stato e report
        if: always() && steps.controllo.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ docs/bandi.json
          if git diff --cached --quiet; then
            echo "Niente da salvare"
          else
            git commit -m "Controllo concorsi del $(date +%d/%m/%Y)"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"   # se nel frattempo è arrivato un altro push
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Apri una issue con le novità
        if: fromJSON(steps.controllo.outputs.nuovi || '0') > 0 || fromJSON(steps.controllo.outputs.in_scadenza || '0') > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Concorsi: ${{ steps.controllo.outputs.titolo }} ($(date +%d/%m/%Y))" \
            --body-file "$RUNNER_TEMP/issue.md"

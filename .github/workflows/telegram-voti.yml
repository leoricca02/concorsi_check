name: Voti da Telegram

on:
  schedule:
    - cron: "7 * * * *"   # ogni ora: Telegram conserva i tocchi sui pulsanti per 24 ore
  workflow_dispatch:
    inputs:
      prova:
        description: "Manda su Telegram un bando di prova con i pulsanti"
        type: boolean
        default: false
  push:                   # serve anche perché GitHub registri il workflow
    paths:
      - "concorsi/telegram_voti.py"
      - ".github/workflows/telegram-voti.yml"

permissions:
  contents: write

concurrency:
  group: telegram-voti
  cancel-in-progress: false

jobs:
  voti:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leggi i voti
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m concorsi.telegram_voti ${{ inputs.prova && '--prova' || '' }}

      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Voti da Telegram"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
